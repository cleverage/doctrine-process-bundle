services:
    _defaults:
        # Public for the direct access from the service container, deprecated since 3.3: private in 4.0
        public: true
        tags:
            - { name: monolog.logger, channel: cleverage_process_task }
            - { name: container.private, package: cleverage/doctrine-process-bundle, version: '3.3' }

    CleverAge\DoctrineProcessBundle\Task\Database\DatabaseReaderTask:
        shared: false
        arguments:
            - '@logger'
            - '@doctrine'
        tags:
            - { name: cleverage.task, code: doctrine_database_reader }
    cleverage_doctrine_process.task.database_reader:
        alias: CleverAge\DoctrineProcessBundle\Task\Database\DatabaseReaderTask
        public: false
        deprecated:
            package: cleverage/doctrine-process-bundle
            version: '3.3'
            message: 'The "%alias_id%" service alias is deprecated, use the "doctrine_database_reader" task code or the class name of the task instead. It will be removed in 4.0.'

